services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD no arquivo .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b > /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD no arquivo .env}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy

  dbhub:
    image: bytebase/dbhub:1.6.0
    command:
      [
        "--config",
        "/config/dbhub.toml",
        "--transport",
        "http",
        "--host",
        "0.0.0.0",
        "--port",
        "8081"
      ]
    environment:
      DB_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./.claude/dbhub.toml:/config/dbhub.toml:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=JoyaPedidos;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    profiles:
      - test

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlserver-data:
